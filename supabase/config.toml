# Local development config for the Supabase CLI (`npx supabase start`).
# The hosted project is configured separately in the Supabase dashboard —
# see docs/SETUP_EXTERNAL.md. Nothing here touches production.
project_id = "meraki-creative"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

# Local email catcher: every auth email sent locally shows up at http://127.0.0.1:54324
[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "100MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/confirm", "http://127.0.0.1:3000/auth/confirm"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# No public registration. Accounts are created only by the studio's invitation flow.
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 10
password_requirements = "lower_upper_letters_digits"

[auth.rate_limit]
email_sent = 30
sign_in_sign_ups = 30
token_verifications = 30

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "30s"
otp_length = 6
otp_expiry = 3600

[auth.email.template.recovery]
subject = "Reset your Meraki Creative password"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.magic_link]
subject = "Your Meraki Creative sign-in link"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.email_change]
subject = "Confirm your new email for Meraki Creative"
content_path = "./supabase/templates/email_change.html"

[auth.sms]
enable_signup = false

[analytics]
enabled = false
